<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Algorithm Complexity Visualizer</title>
    <style>
        :root { color-scheme: light; --ink: #17212b; --muted: #5d6873; --paper: #f4f0e8; --panel: #fffdf8; --accent: #d45b3f; --line: #d9d1c4; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; color: var(--ink); background: radial-gradient(circle at top right, #f7d7a8, transparent 35%), var(--paper); font-family: Georgia, "Times New Roman", serif; }
        main { width: min(100% - 32px, 980px); margin: 0 auto; padding: 64px 0; }
        .eyebrow { color: var(--accent); font: 700 0.78rem/1.2 Arial, sans-serif; letter-spacing: 0.14em; text-transform: uppercase; }
        h1 { max-width: 680px; margin: 12px 0; font-size: 4.5rem; line-height: .92; }
        .intro { max-width: 570px; color: var(--muted); font: 1.08rem/1.5 Arial, sans-serif; }
        form, .result { margin-top: 36px; padding: 24px; border: 1px solid var(--line); background: var(--panel); box-shadow: 8px 8px 0 #eadfce; }
        .controls { display: grid; grid-template-columns: 1.5fr 1fr 1fr auto; gap: 14px; align-items: end; }
        label { display: grid; gap: 7px; color: var(--muted); font: 700 .75rem Arial, sans-serif; text-transform: uppercase; letter-spacing: .08em; }
        select, input, button { width: 100%; min-height: 44px; border: 1px solid var(--line); padding: 0 12px; color: var(--ink); background: white; font: 1rem Arial, sans-serif; }
        button { border-color: var(--accent); color: white; background: var(--accent); cursor: pointer; font-weight: 700; }
        button:disabled { opacity: .6; cursor: wait; }
        #status { color: var(--muted); font: .9rem Arial, sans-serif; }
        #plot { display: block; width: 100%; margin-top: 18px; border: 1px solid var(--line); }
        .hidden { display: none; }
        @media (max-width: 700px) { h1 { font-size: 2.8rem; } .controls { grid-template-columns: 1fr 1fr; } .controls label:first-child { grid-column: 1 / -1; } }
    </style>
</head>
<body>
<main>
    <div class="eyebrow">Flask laboratory</div>
    <h1>See how your algorithm scales.</h1>
    <p class="intro">Choose an algorithm, set the input range, and generate a timing plot directly in your browser.</p>
    <form id="analyze-form">
        <div class="controls">
            <label>Algorithm
                <select id="algo" name="algo">
                    <option value="linear_search">linear search</option>
                    <option value="bubble_sort">bubble sort</option>
                    <option value="binary_search">binary search</option>
                    <option value="nested_loops">nested loops</option>
                    <option value="selection_sort">selection sort</option>
                    <option value="insertion_sort">insertion sort</option>
                </select>
            </label>
            <label>Step <input id="step" name="step" type="number" min="1" value="100"></label>
            <label>Maximum n <input id="n_max" name="n_max" type="number" min="0" value="1000"></label>
            <button id="submit" type="submit">Visualize</button>
        </div>
    </form>
    <section id="result" class="result hidden">
        <div id="status"></div>
        <img id="plot" alt="Algorithm execution time plot">
    </section>
</main>
<script>
    const form = document.querySelector('#analyze-form');
    const button = document.querySelector('#submit');
    const result = document.querySelector('#result');
    const status = document.querySelector('#status');
    const plot = document.querySelector('#plot');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        button.disabled = true;
        button.textContent = 'Measuring...';
        result.classList.remove('hidden');
        status.textContent = 'Running measurements...';
        try {
            const params = new URLSearchParams(new FormData(form));
            const response = await fetch(`/analyze?${params}`);
            const responseText = await response.text();
            let payload;
            try { payload = JSON.parse(responseText); }
            catch { throw new Error(`The Flask API returned HTML instead of JSON (status ${response.status}). Open http://127.0.0.1:8000/.`); }
            if (!response.ok) throw new Error(payload.error || 'The analysis failed.');
            plot.src = `data:image/png;base64,${payload.image_base64}`;
            status.textContent = `${payload.algo.replaceAll('_', ' ')} measured from n = 0 to ${payload.n_max}.`;
        } catch (error) {
            status.textContent = error.message;
            plot.removeAttribute('src');
        } finally {
            button.disabled = false;
            button.textContent = 'Visualize';
        }
    });
</script>
</body>
</html>
